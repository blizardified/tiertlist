<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10150f">
  <title>Hollow Tiers</title>
  <style>
    :root{color-scheme:dark;--bg:#10150f;--panel:#192119;--panel2:#202a20;--line:#354334;--text:#f1f4e9;--muted:#a6b19d;--green:#9fd66c;--gold:#e3c56d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#2b4027 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:36px 20px 56px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.04em;margin:7px 0}.sub{color:var(--muted);margin:8px 0 0}.badge{border:1px solid #557047;background:#243522;color:#d6f2bd;border-radius:999px;padding:8px 13px;font-weight:750;white-space:nowrap}
    .kit-tabs{display:flex;gap:8px;margin:0 0 14px}.kit-tab{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);padding:9px 14px;font-weight:750}.kit-tab.active{background:#2a3b26;border-color:#668354;color:#e7f4dd}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:14px;margin-bottom:18px}.toolbar input,.toolbar select{background:#10160f;color:var(--text);border:1px solid #43513f;border-radius:9px;padding:10px 12px;font:inherit}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:110px}button{font:inherit;cursor:pointer}.add{border:0;border-radius:9px;background:var(--green);color:#14200f;padding:10px 15px;font-weight:850}.add:hover{filter:brightness(1.08)}
    .search-box{margin:0 0 14px}.search-box input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit}.search-results{display:grid;gap:7px;margin-top:8px}.search-result{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#202a20;border:1px solid #3d4a39;border-radius:9px;padding:9px 12px}.search-result small{color:var(--muted)}.search-tier{font-weight:850;color:var(--green);white-space:nowrap}.no-results{color:var(--muted);font-size:13px;padding:4px 2px}
    .notice{color:var(--muted);font-size:13px;margin:0 0 12px}.board{display:grid;gap:9px}.tier{display:grid;grid-template-columns:115px 1fr;min-height:78px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);transition:border-color .15s,transform .15s}.tier.over{border-color:var(--gold);transform:scale(1.006)}.tier-label{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:950;letter-spacing:.04em;color:#13200f;background:#8d9b80}.tier[data-tier="LT5"] .tier-label{background:#9b6c61;color:white}.tier[data-tier="HT5"] .tier-label{background:#bd8062;color:#1d100c}.tier[data-tier="LT4"] .tier-label{background:#d0a05c;color:#211708}.tier[data-tier="HT4"] .tier-label{background:#dec45f;color:#211d08}.tier[data-tier="LT3"] .tier-label{background:#a9c960;color:#17200b}.tier[data-tier="HT3"] .tier-label{background:#7dc574;color:#10200e}.tier[data-tier="LT2"] .tier-label{background:#62c8a2;color:#092117}.tier[data-tier="HT2"] .tier-label{background:#63c4cd;color:#0c1e21}.tier[data-tier="LT1"] .tier-label{background:#76a9e8;color:#101a28}.tier[data-tier="HT1"] .tier-label{background:#a28ae9;color:#19122c}
    .cards{display:flex;align-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:11px;min-width:0}.empty{color:#75816f;font-size:13px;padding:5px 2px}.player{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid #3d4a39;border-radius:9px;padding:8px 10px 8px 12px;font-weight:700;cursor:grab;user-select:none;max-width:100%}.player:active{cursor:grabbing}.player.dragging{opacity:.42}.player-name{overflow-wrap:anywhere}.remove{border:0;border-radius:6px;background:transparent;color:#9ba895;padding:2px 5px;font-size:17px;line-height:1}.remove:hover{background:#48312d;color:#ffb1a2}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:15px;color:var(--muted);font-size:12px}.reset{background:transparent;color:#bec8b8;border:1px solid var(--line);border-radius:8px;padding:7px 10px}.reset:hover{border-color:#8b9c82;color:white}
    @media(max-width:600px){.wrap{padding:26px 12px 40px}.top{display:block}.badge{display:inline-block;margin-top:14px}.tier{grid-template-columns:74px 1fr;min-height:72px}.tier-label{font-size:15px}.toolbar{padding:10px}.toolbar input{flex-basis:100%}.foot{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><div class="eyebrow">Minecraft PvP · Player rankings</div><h1 class="title">Hollow Tiers</h1><p class="sub" id="kit-description">Sword kit player rankings.</p></div>
      <div class="badge">10 tiers · HT1 → LT5</div>
    </header>
    <nav class="kit-tabs" aria-label="Choose a kit"><button class="kit-tab active" data-kit="Sword" type="button">Sword</button><button class="kit-tab" data-kit="Diamond Pot" type="button">Diamond Pot</button><button class="kit-tab" data-kit="Nethpot" type="button">Nethpot</button></nav>
    <div class="search-box"><input id="search-input" type="search" placeholder="Search players across kits…" aria-label="Search players"><div class="search-results" id="search-results" aria-live="polite"></div></div>
    <form class="toolbar" id="add-form">
      <input id="player-input" maxlength="32" placeholder="Enter a player name…" aria-label="Player name" required>
      <select id="tier-select" aria-label="Choose a tier"></select>
      <button class="add" type="submit">Add player</button>
    </form>
    <p class="notice">Drag a player card to another tier. Use × to remove a player. Your list saves in this browser.</p>
    <section class="board" id="board" aria-label="Sword player tiers"></section>
    <footer class="foot"><span id="save-note">Edits save in this browser.</span><button class="reset" id="reset" type="button">Reset this kit</button></footer>
  </main>
  <script>
    const tiers=['HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5'];
    const initial=[{name:'_skibble',tier:'LT5'},{name:'blizardified',tier:'HT1'}];
    const storageKey='minecraft-sword-tier-list-v1';
    let currentKit='Sword';
    function keyFor(kit){return kit==='Sword'?storageKey:'minecraft-'+kit.toLowerCase().replace(/\s+/g,'-')+'-tier-list-v1'}
    function loadPlayers(kit){try{const saved=JSON.parse(localStorage.getItem(keyFor(kit)));return Array.isArray(saved)?saved.map(p=>({...p,id:p.id||crypto.randomUUID()})):(kit==='Sword'?initial.map(p=>({...p,id:crypto.randomUUID()})):[])}catch{return kit==='Sword'?initial.map(p=>({...p,id:crypto.randomUUID()})):[]}}
    let players=loadPlayers(currentKit);
    const board=document.querySelector('#board'), select=document.querySelector('#tier-select');
    tiers.forEach((tier,i)=>{const option=document.createElement('option');option.value=tier;option.textContent=tier;option.selected=tier==='LT5';select.append(option)});
    function save(){localStorage.setItem(keyFor(currentKit),JSON.stringify(players))}
    function renderSearch(){
      const query=document.querySelector('#search-input').value.trim().toLocaleLowerCase();
      const results=document.querySelector('#search-results');results.replaceChildren();if(!query)return;
      const matches=['Sword','Diamond Pot','Nethpot'].flatMap(kit=>loadPlayers(kit).filter(p=>p.name.toLocaleLowerCase().includes(query)).map(p=>({name:p.name,tier:p.tier,kit}))).sort((a,b)=>a.name.localeCompare(b.name));
      if(!matches.length){const empty=document.createElement('div');empty.className='no-results';empty.textContent='No matching players yet.';results.append(empty);return}
      matches.forEach(match=>{const row=document.createElement('div');row.className='search-result';const who=document.createElement('span');who.textContent=match.name;const info=document.createElement('span');info.innerHTML='';const kit=document.createElement('small');kit.textContent=match.kit+' · ';const tier=document.createElement('span');tier.className='search-tier';tier.textContent=match.tier;info.append(kit,tier);row.append(who,info);results.append(row)});
    }
    function render(){
      board.replaceChildren();
      tiers.forEach(tier=>{
        const row=document.createElement('div');row.className='tier';row.dataset.tier=tier;row.setAttribute('aria-label',tier+' tier');
        const label=document.createElement('div');label.className='tier-label';label.textContent=tier;
        const cards=document.createElement('div');cards.className='cards';cards.dataset.tier=tier;
        const inTier=players.filter(p=>p.tier===tier);
        if(!inTier.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='Drop players here';cards.append(empty)}
        inTier.forEach(player=>{
          const card=document.createElement('div');card.className='player';card.draggable=true;
          const name=document.createElement('span');name.className='player-name';name.textContent=player.name;
          const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.title='Remove '+player.name;remove.setAttribute('aria-label','Remove '+player.name);
          remove.addEventListener('click',()=>{players=players.filter(p=>p.id!==player.id);save();render()});
          card.addEventListener('dragstart',event=>{card.classList.add('dragging');event.dataTransfer.setData('text/plain',player.id)});
          card.addEventListener('dragend',()=>card.classList.remove('dragging'));
          card.append(name,remove);cards.append(card);
        });
        cards.addEventListener('dragover',event=>{event.preventDefault();row.classList.add('over')});
        cards.addEventListener('dragleave',event=>{if(!row.contains(event.relatedTarget))row.classList.remove('over')});
        cards.addEventListener('drop',event=>{event.preventDefault();row.classList.remove('over');const id=event.dataTransfer.getData('text/plain');const found=players.find(p=>p.id===id);if(found){found.tier=tier;save();render()}});
        row.append(label,cards);board.append(row);
      });
      renderSearch();
    }
    document.querySelector('#add-form').addEventListener('submit',event=>{event.preventDefault();const field=document.querySelector('#player-input');const name=field.value.trim();if(!name)return;players.push({id:crypto.randomUUID(),name,tier:select.value});save();field.value='';render();field.focus()});
    document.querySelectorAll('.kit-tab').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.kit===currentKit)return;save();currentKit=button.dataset.kit;players=loadPlayers(currentKit);document.querySelectorAll('.kit-tab').forEach(tab=>tab.classList.toggle('active',tab===button));document.querySelector('#kit-description').textContent=currentKit+' kit player rankings.';render()}));
    document.querySelector('#search-input').addEventListener('input',renderSearch);
    document.querySelector('#reset').addEventListener('click',()=>{players=currentKit==='Sword'?initial.map(p=>({...p,id:crypto.randomUUID()})):[];save();render()});
    save();render();
  </script>
</body>
</html>
